spring:
  datasource:
    url: jdbc:h2:mem:signalroom;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: never

app:
  jwt:
    secret: test-secret-key-for-local-validation-1234567890
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
